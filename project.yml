# XcodeGen: `xcodegen generate` writes ClubApp.xcodeproj (not committed). CI runs it; see SPEC-club-ios.md.
name: ClubApp
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
packages:
  ClubKit:
    path: ClubKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    CLUB_API_URL: http://localhost:8080
    # Supabase project of the club (DEPLOY.md Part 16.4); the publishable key is public by design.
    CLUB_SUPABASE_URL: http://localhost:54321
    CLUB_SUPABASE_KEY: ""
    CLUB_APP_NAME: Verein
targets:
  ClubApp:
    type: application
    platform: iOS
    sources:
      - App
      # German texts of the server's error codes (scripts/error-texts.mjs); ClubKit's tests check them.
      - path: ClubKit/Contract/error-texts.json
        buildPhase: resources
    dependencies:
      - package: ClubKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(CLUB_APP_NAME)
        ClubAPIURL: $(CLUB_API_URL)
        ClubSupabaseURL: $(CLUB_SUPABASE_URL)
        ClubSupabaseKey: $(CLUB_SUPABASE_KEY)
        # Bundled brand fonts (App/Resources/Fonts, SIL OFL; licences beside them).
        UIAppFonts: [Inter-Regular.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf, Anton-Regular.ttf]
        NSFaceIDUsageDescription: Damit du die App mit Face ID entsperren kannst.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.clubserver.app
        TARGETED_DEVICE_FAMILY: "1"
  ClubAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: ClubApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.clubserver.app.tests
schemes:
  ClubApp:
    build:
      targets:
        ClubApp: all
    test:
      targets: [ClubAppTests]
